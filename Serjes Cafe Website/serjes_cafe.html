    <section id="login">
      <div class="login-card">
        <div class="login-brand">
          <img src="logo.jpg" alt="Serjes Cafe logo" />
          <div class="logo">SERJES CAFE</div>
          <div class="sub">Minimal cafe sales & operations dashboard</div>
        </div>
        <form id="loginForm">
          <label>Username</label
          ><input id="username" required placeholder="Enter username" />
          <label>Password</label>
          <div class="password-wrap">
            <input
              id="password"
              type="password"
              required
              placeholder="Enter password"
            /><button
              type="button"
              class="password-toggle"
              onclick="togglePassword('password', this)"
            >
              Show
            </button>
          </div>
          <button type="button" class="forgot-link" onclick="forgotPassword()">
            Forgot Password?
          </button>
          <button class="primary">Sign in</button>
        </form>
      </div>
    </section>

    <div id="app" class="app hidden">
      <aside class="sidebar">
        <div class="brand">
          SERJES <span class="role" id="roleLabel"></span>
        </div>
        <nav class="nav" id="nav"></nav>
        <button class="logout" onclick="logout()">Log out</button>
      </aside>
      <main>
        <div class="topbar">
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="muted" id="dateLabel"></div>
          </div>
          <div class="badge" id="userLabel"></div>
        </div>
        <section id="content"></section>
      </main>
    </div>
    <div id="modal" class="modal hidden" onclick="closeModal(event)">

      function formatPeriodLabel(period, dateValue) {
        const d = new Date(dateValue + "T00:00:00");
        if (period === "day")
          return d.toLocaleDateString("en-PH", {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric",
          });
        if (period === "week") {
          let start = getWeekStart(d);
          let end = new Date(start);
          end.setDate(start.getDate() + 6);
          return `${start.toLocaleDateString("en-PH", { month: "short", day: "numeric" })} - ${end.toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" })}`;
        }
        if (period === "month")
          return d.toLocaleDateString("en-PH", {
            month: "long",
            year: "numeric",
          });
        return d.toLocaleDateString("en-PH", { year: "numeric" });
      }
      function getWeekStart(date) {
        let start = new Date(date);
        let day = (start.getDay() + 6) % 7;
        start.setDate(start.getDate() - day);
        return start;
      }
      function getCalendarPeriodDates(period, dateValue) {
        const d = new Date(dateValue + "T00:00:00");
        let dates = [];
        if (period === "day") {
          dates = [dateValue];
          return dates;
        }
        if (period === "week") {
          let start = getWeekStart(d);
          for (let i = 0; i < 7; i++) {
            let day = new Date(start);
            day.setDate(start.getDate() + i);
            dates.push(day.toISOString().slice(0, 10));
          }
          return dates;
        }
        if (period === "month") {
          let year = d.getFullYear();
          let month = d.getMonth();
          let lastDay = new Date(year, month + 1, 0).getDate();
          for (let i = 1; i <= lastDay; i++) {
            let dt = new Date(year, month, i);
            dates.push(dt.toISOString().slice(0, 10));
          }
          return dates;
        }
        let year = d.getFullYear();
        for (let m = 0; m < 12; m++) {
          let dt = new Date(year, m, 1);
          dates.push(dt.toISOString().slice(0, 10));
        }

      ${note ? `<span style="margin-top:4px;font-size:10px;color:#ddd;line-height:1.3;display:block;max-height:32px;overflow:hidden;">${note.slice(0, 30)}${note.length > 30 ? "..." : ""}</span>` : ``}

      function calendarDateList(period, dateValue) {

      function updatePurchaseOrderStatus(id, status) {

        const product = data.products.find(
          (item) => item.id === purchaseOrder.productId,
        );
        if (product) {
          const wasReceived = purchaseOrder.status === "Received";
          const willBeReceived = status === "Received";
          if (!wasReceived && willBeReceived)
            product.stock += purchaseOrder.quantity;
          if (wasReceived && !willBeReceived)
            product.stock = Math.max(0, product.stock - purchaseOrder.quantity);
        }
        purchaseOrder.status = status;
        save();
        go(
          "purchaseOrders",
          document.querySelector('[data-page="purchaseOrders"]'),
        );

      }
      function addStaff(e) {
        e.preventDefault();
        let name = staffName.value.trim();
        if (data.staff.some((s) => s.username === name))
          return alert("Username already exists.");
        data.staff.push({
          id: Date.now(),
          username: name,
          password: staffPassword.value,
          role: staffRole.value,
        });
        save();
        closeModal();
        go("staff", document.querySelector('[data-page="staff"]'));
      }
      function deleteStaff(id) {
        if (!confirm("Delete this staff account?")) return;
        data.staff = data.staff.filter((s) => s.id !== id);
        save();
        go("staff", document.querySelector('[data-page="staff"]'));
      }
      function draw(page) {
        setTimeout(() => {
          const sales = filteredSales(),
            days = [...Array(7)].map((_, i) => {
              let d = new Date();
              d.setDate(d.getDate() - (6 - i));
              return d.toISOString().slice(0, 10);
            });
          const vals = days.map((d) =>
            sales.filter((s) => s.date === d).reduce((a, s) => a + s.total, 0),
          );
          const profits = days.map((d) =>
            sales
              .filter((s) => s.date === d)
              .reduce((a, s) => a + s.total - s.cost, 0),
          );
          const ctx = document.getElementById("salesChart");
          if (ctx) {
            if (chart1) chart1.destroy();
            chart1 = new Chart(ctx, {
              type: "line",
              data: {
                labels: days.map((d) => d.slice(5)),
                datasets: [
                  { label: "Revenue", data: vals },
                  { label: "Profit", data: profits },
                ],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: "#bbb" } } },
                scales: {
                  x: { ticks: { color: "#888" }, grid: { color: "#222" } },
                  y: { ticks: { color: "#888" }, grid: { color: "#222" } },
                },
              },
            });
          }
          const fc = document.getElementById("flowChart");
          if (fc) {
            let hours = [
              "08",
              "09",
              "10",
              "11",
              "12",
              "13",
              "14",
              "15",
              "16",
              "17",
            ];
            let hv = hours.map((h) =>
              sales
                .filter((s) => s.time.startsWith(h))
                .reduce((a, s) => a + 1, 0),
            );
            if (chart2) chart2.destroy();
            chart2 = new Chart(fc, {
              type: "bar",
              data: {
                labels: hours.map((h) => h + ":00"),
                datasets: [{ label: "Orders", data: hv }],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: "#bbb" } } },
                scales: {
                  x: { ticks: { color: "#888" }, grid: { color: "#222" } },
                  y: {
                    ticks: { color: "#888" },
                    grid: { color: "#222" },
                    beginAtZero: true,
                  },
                },
              },
            });
          }
        }, 50);
      }
      function exportCSV() {
        let rows = [
          [
            "ID",
            "Date",
            "Time",
            "Staff",
            "Product",
            "Qty",
            "Revenue",
            "Cost",
            "Profit",
          ],
          ...data.sales.map((s) => [
            s.id,
            s.date,
            s.time,
            s.staff,
            s.product,
            s.qty,
            s.total,
            s.cost,
            s.total - s.cost,
          ]),
        ];
        let csv = rows.map((r) => r.join(",")).join("\\n");
        let a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "serjes-cafe-sales.csv";
        a.click();
      }
      const saved = localStorage.getItem("serjesSession");
      initializeCalendarState();
      if (saved) {
        session = JSON.parse(saved);
        showApp();
      }
    </script>
  </body>
</html>
